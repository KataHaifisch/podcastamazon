name: Auto Update Podcast Feed

on:
  schedule:
    - cron: '0 */6 * * *' # Prüft alle 6 Stunden vollautomatisch
  workflow_dispatch:      # Erlaubt manuellen Start per Klick

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Feed aktualisieren
        run: python update_feed.py

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add katahaifisch_podcasts.xml applekatahaifisch_all.xml

          git diff --staged --quiet || (git commit -m "Auto-update: Neue Podcasts hinzugefügt" && git push)
